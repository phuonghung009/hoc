apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.dethihub.englishexam'
    compileSdk 34

    defaultConfig {
        applicationId "com.dethihub.englishexam"
        // minSdk 26 (Android 8.0+) để dùng được adaptive icon mặc định của hệ
        // thống mà không cần tự vẽ icon riêng — có thể hạ xuống nếu cần hỗ trợ
        // máy cũ hơn, nhưng khi đó nên tự thêm icon PNG cho các mipmap cũ.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Chỉ cần đúng 1 thư viện: WebViewAssetLoader, để phục vụ file trong
    // assets/www/ qua "https://appassets.androidplatform.net/..." — cách
    // Google khuyến nghị thay vì dùng thẳng file:// (tránh lỗi CORS/storage).
    implementation 'androidx.webkit:webkit:1.11.0'
}
